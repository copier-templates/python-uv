# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

minimum_prek_version = "0.5.6"

# Ensure Git shims exist for every stage this config uses: pre-commit fixers and
# checks, the commit-msg conventional-commit check, and the pre-push
# version-tag gate. Without this, `prek install` only installs the pre-commit
# shim and stage-specific hooks never fire.
default_install_hook_types = [
  "pre-commit",
  "commit-msg",
  "pre-push",
]

# Hooks without an explicit `stages` list run on every installed shim
# (pre-commit *and* commit-msg on every commit, plus pre-push on every push).
# Pin the default to pre-commit so each hook runs once; stage-specific hooks
# (conventional-pre-commit, check-version-tag) declare their own stages.
default_stages = [
  "pre-commit",
]

# Hold new hook revs back for a week so `prek update` never adopts a freshly published tag.
[update]
cooldown_days = 7

# Lower tiers run first. Each file-mutating fixer gets its own tier so writers never race
# on the same file; read-only checks share one tier and run concurrently after all fixers.
[priorities]
fix-eof = 0
fix-bom = 1
fix-line-endings = 2
fix-whitespace = 3
fix-ruff-check = 4
fix-ruff-format = 5
fix-toml = 6
checks = 10

[[repos]]
repo = "https://github.com/jumanjihouse/pre-commit-hooks"
rev = "3.0.0"
hooks = [
  { id = "forbid-binary", priority = "checks" },
  { id = "script-must-have-extension", priority = "checks" },
  { id = "shellcheck", priority = "checks" },
]

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files", priority = "checks" },
  { id = "check-executables-have-shebangs", priority = "checks" },
  { id = "check-merge-conflict", priority = "checks" },
  { id = "check-toml", priority = "checks" },
  { id = "check-yaml", priority = "checks", args = [
    "--allow-multiple-documents",
  ] },
  { id = "detect-private-key", priority = "checks" },
  { id = "end-of-file-fixer", priority = "fix-eof" },
  { id = "fix-byte-order-marker", priority = "fix-bom" },
  { id = "mixed-line-ending", priority = "fix-line-endings" },
  { id = "trailing-whitespace", priority = "fix-whitespace", args = [
    "--markdown-linebreak-ext=md",
  ] },
]

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"
hooks = [
  { id = "gitleaks", priority = "checks" },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.17.2"
hooks = [
  { id = "ruff-check", priority = "fix-ruff-check", types_or = [
    "python",
    "pyi",
  ], args = [
    "--fix",
  ] },
  { id = "ruff-format", priority = "fix-ruff-format", types_or = [
    "python",
    "pyi",
  ] },
]

[[repos]]
repo = "local"
hooks = [
  { id = "taplo-format", name = "taplo format", entry = "taplo format", language = "system", files = "\\.toml$", priority = "fix-toml" },
  { id = "vulture", name = "vulture dead code", entry = "mise run lint:deadcode", language = "system", pass_filenames = false, always_run = true, priority = "checks" },
  { id = "check-version-tag", name = "pyproject version matches latest tag", entry = "mise run check:version-tag", language = "system", stages = [
    "pre-push",
  ], pass_filenames = false, always_run = true, priority = "checks" },
]

[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "v4.4.0"
hooks = [
  { id = "conventional-pre-commit", priority = "checks", stages = [
    "commit-msg",
  ], args = [
    "--verbose",
  ] },
]
