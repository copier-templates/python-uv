[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "copier-python-uv"
version = "0.4.0"
description = "Copier template to bootstrap a Python package with uv and basic configuration"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Patryk Kubiak", email = "8299306+kpatryk@users.noreply.github.com"}
]
keywords = ["copier", "template", "python", "uv", "packaging"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "copier>=9.11.3",
]

[project.urls]
Homepage = "https://github.com/patryk-gpl/copier-python-uv"
Repository = "https://github.com/patryk-gpl/copier-python-uv.git"
"Bug Tracker" = "https://github.com/patryk-gpl/copier-python-uv/issues"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.15",
]

[tool.pytest.ini_options]
testpaths = ["my_tests"]
addopts = "--durations=5 --durations-min=0.0 --tb=short"
filterwarnings = [
    "ignore:Dirty template changes included automatically:copier._vcs.DirtyLocalWarning",
]
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "Q",    # flake8-quotes
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "C90",  # mccabe complexity
    "SIM",  # flake8-simplify
    "DTZ",  # flake8-datetimez
    "ARG",  # unused arguments
    "PLE",  # Pylint errors
    "PLW",  # Pylint warnings
    "PLC",  # Pylint conventions
    "UP",   # pyupgrade
    "S",    # flake8-bandit
]
ignore = [
    "E501",  # line-too-long (formatter handles wrapping, but may exceed limit)
]

[tool.ruff.lint.per-file-ignores]
"my_tests/**/*.py" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["my_tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
