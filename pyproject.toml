[build-system]
requires = [
  "setuptools>=61.0",
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
exclude = [
  "templates*",
  "extensions*",
  "tests*",
  "src*",
]

[project]
name = "copier-python-uv"
version = "0.2.2"
description = "Copier template to bootstrap a Python package with uv and basic configuration"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = [
  "LICENSE",
]
authors = [
  { name = "Patryk Kubiak", email = "8299306+kpatryk@users.noreply.github.com" },
]
keywords = [
  "copier",
  "template",
  "python",
  "uv",
  "packaging",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "copier>=9.11.3",
]

[project.urls]
Homepage = "https://github.com/patryk-gpl/copier-python-uv"
Repository = "https://github.com/patryk-gpl/copier-python-uv.git"
"Bug Tracker" = "https://github.com/patryk-gpl/copier-python-uv/issues"

[dependency-groups]
dev = [
  "pytest>=9.0.2",
  "pytest-cov>=7.0.0",
  "ruff>=0.15.15",
  "ty>=0.0.34",
]

[tool.pytest.ini_options]
testpaths = [
  "tests",
]
pythonpath = [
  "scripts",
  "scripts/maintainer",
  "tasks",
  "templates/scripts",
]
addopts = "--durations=5 --durations-min=0.0 --tb=short --strict-markers --cov=scripts --cov=scripts/maintainer --cov=tasks --cov=templates/scripts --cov-report=html --cov-report=term-missing"
filterwarnings = [
  "ignore:Dirty template changes included automatically:copier._vcs.DirtyLocalWarning",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ty.environment]
python-version = "3.12"
extra-paths = [
  "scripts",
  "scripts/maintainer",
  "tasks",
  "templates/scripts",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # Pyflakes
  "I",   # isort
  "Q",   # flake8-quotes
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "C90", # mccabe complexity
  "SIM", # flake8-simplify
  "DTZ", # flake8-datetimez
  "ARG", # unused arguments
  "PLE", # Pylint errors
  "PLW", # Pylint warnings
  "PLC", # Pylint conventions
  "UP",  # pyupgrade
  "S",   # flake8-bandit
]
ignore = [
  "E501", # line-too-long (formatter handles wrapping, but may exceed limit)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "S101",
  "S105",
  "S106",
  "S603",
]

[tool.ruff.lint.isort]
known-first-party = [
  "tests",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
