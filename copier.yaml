project_name:
    type: str
    help: What is your project name?
    validator: >-
        {% if not project_name.replace('_', '').replace('-', '').isalnum() %}
        Project name must be alphanumeric with underscores/dashes only
        {% elif project_name[0].isdigit() %}
        Project name must not start with a digit
        {% endif %}

project_type:
    type: str
    help: Which uv-style project type should be generated?
    choices:
        Application: app
        Packaged application: package
        Library: lib
    default: package

python_version:
    type: str
    help: Which Python version should the project target? (3.11 or newer)
    choices:
        # python-version-choices: begin (managed by scripts/update_python_versions.py, do not edit)
        "3.15": "3.15"
        "3.14": "3.14"
        "3.13": "3.13"
        "3.12": "3.12"
        "3.11": "3.11"
        # python-version-choices: end
    default: "3.11"

module_name:
    type: str
    default: "{{ project_name|replace('-', '_') }}"
    when: false

project_description:
    type: str
    help: Please type a short description of your project
    default: "A modern Python application."

author_name:
    type: str
    help: Please type the author name
    default: "Patryk"

author_email:
    type: str
    help: Please type the author email
    default: "8299306+kpatryk@users.noreply.github.com"
    validator: >-
        {% set _ae = (author_email or '') %}
        {% if '@' not in _ae or _ae.split('@')|length != 2 or _ae.split('@')[0] == '' or _ae.split('@')[1] == '' or '.' not in _ae.split('@')[1] or ' ' in _ae %}
        Email must be a valid address like username@test.com
        {% endif %}

production_deps:
    type: json
    help: "Enter production dependencies as a JSON array (e.g., [\"httpx[http2]\"])"
    default: []

dev_deps:
    type: json
    help: "Enter development dependencies as a JSON array"
    default: ["pytest", "pytest-cov", "ruff"]

include_license:
    type: bool
    help: "Include a LICENSE file in the project?"
    default: false

license_type:
    type: str
    help: "Choose a license type"
    choices:
        MIT: mit
        Apache 2.0: apache-2.0
        GNU General Public License v2.0: gpl-2.0
        GNU General Public License v3.0: gpl-3.0
        GNU Lesser General Public License v2.0: lgpl-2.0
        GNU Lesser General Public License v2.1: lgpl-2.1
        GNU Lesser General Public License v3.0: lgpl-3.0
        Mozilla Public License 2.0: mpl-2.0
    default: mit
    when: "{{ include_license }}"

license_spdx:
    type: str
    default: >-
        {{ {
            'mit': 'MIT',
            'apache-2.0': 'Apache-2.0',
            'gpl-2.0': 'GPL-2.0-only',
            'gpl-3.0': 'GPL-3.0-only',
            'lgpl-2.0': 'LGPL-2.0-only',
            'lgpl-2.1': 'LGPL-2.1-only',
            'lgpl-3.0': 'LGPL-3.0-only',
            'mpl-2.0': 'MPL-2.0',
        }[license_type] }}
    when: false

github_integration:
    type: bool
    help: "Include GitHub workflow templates?"
    default: false

# Computed render facts (when: false — derived from the answers above, omitted from the answers file).
is_app:
    type: bool
    default: "{{ project_type == 'app' }}"
    when: false

is_lib:
    type: bool
    default: "{{ project_type == 'lib' }}"
    when: false

is_package:
    type: bool
    default: "{{ project_type == 'package' }}"
    when: false

# PEP 503-normalised distribution names, without extras, specifiers or markers.
dev_dep_names:
    type: json
    default: >-
        {{ dev_deps
        | map('regex_replace', '^\\s*([A-Za-z0-9][A-Za-z0-9._-]*).*$', '\\1')
        | map('lower')
        | map('regex_replace', '[-_.]+', '-')
        | list | tojson }}
    when: false

with_ruff:
    type: bool
    default: "{{ 'ruff' in dev_dep_names }}"
    when: false

with_pytest:
    type: bool
    default: "{{ 'pytest' in dev_dep_names }}"
    when: false

with_pytest_cov:
    type: bool
    default: "{{ 'pytest-cov' in dev_dep_names }}"
    when: false

# Post-copy `mise run ci` exists only when the project has both pytest and ruff.
verify_ci:
    type: bool
    default: "{{ with_pytest and with_ruff }}"
    when: false

_min_copier_version: "9.0.0"
_templates_suffix: .jinja
_subdirectory: templates
_envops:
    undefined: "jinja2.StrictUndefined"

_exclude:
    - "licenses"
    - "licenses/*"
    - "{% if is_app %}src{% endif %}"
    - "{% if not is_app %}main.py{% endif %}"
    - "{% if not is_lib %}src/{{module_name}}/py.typed{% endif %}"
    - "{% if not include_license %}LICENSE{% endif %}"
    - "{% if not github_integration %}.github{% endif %}"

_tasks:
    - ["uv", "python", "install", '{{ python_version }}']
    - ["uv", "sync"]
    - command: ["mise", "trust"]
    - command:
          - "{{ _copier_python }}"
          - "{{ _copier_conf.src_path }}/tasks/lifecycle.py"
          - "{{ _copier_operation }}"
          - "--verify-ci={{ verify_ci }}"
      when: "{{ _copier_operation in ['copy', 'update'] }}"

_message_after_copy: |
    Your project "{{ project_name }}" was created{% if verify_ci %} and verified (`mise run install` + `mise run ci` passed){% else %} (`mise run install` passed){% endif %}.
    Next steps:
      cd {{ _folder_name }}
