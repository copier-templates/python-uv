name: OpenCode Agent Workflow

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    # Trigger only when someone invokes the agent using commands
    if: |
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Run OpenCode Agent
        uses: anomalyco/opencode/github@latest
        env:
          # Injected from your repository secrets
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          # Set the default model provided by your Go subscription
          model: deepseek/deepseek-v4-1-flash
          use_github_token: true
