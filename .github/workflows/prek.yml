name: Scheduled Prek Auto-Update

"on":
  schedule:
    # 06:00 UTC on the 1st of every month
    - cron: "0 6 1 * *"
  # Manual trigger from the Actions tab
  workflow_dispatch:

# Serialize scheduled and manual runs: avoids duplicate work and push races
concurrency:
  group: prek-update
  cancel-in-progress: false

jobs:
  auto-update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Needed for GITHUB_TOKEN to commit and push the updated config
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Full history avoids shallow-clone issues on push
          fetch-depth: 0

      - name: Install pinned toolchain with mise
        uses: jdx/mise-action@v4

      - name: Cache prek
        uses: actions/cache@v5
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('prek.toml') }}
          restore-keys: |
            prek-${{ runner.os }}-

      - name: Run prek update
        id: update
        run: |
          prek update

          # Detect changes (step output, not env var)
          if git diff --quiet -- prek.toml; then
            echo "changes=false" >> "$GITHUB_OUTPUT"
            echo "No prek updates available."
          else
            echo "changes=true" >> "$GITHUB_OUTPUT"
            echo "Prek updates detected:"
            git diff --stat -- prek.toml
          fi

      - name: Commit and push updates
        if: steps.update.outputs.changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prek.toml
          # Only commit if staged content differs (avoids empty-commit race)
          if git diff --cached --quiet; then
            echo "Nothing staged, skipping commit."
          else
            git commit -m "chore(deps): auto-update prek hooks"
            git push
          fi
